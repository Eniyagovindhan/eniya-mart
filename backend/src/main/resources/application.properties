# =============================================================
# ENIYA MART - Everything You Need. Easy Shopping.
# Spring Boot 3 / Java 17 / MySQL 8
# =============================================================
spring.application.name=eniya-mart
# Local default 8080; Railway injects PORT
server.port=${PORT:8080}

# ------------------------------- MySQL 8 ---------------------
# Local: unchanged behaviour (localhost, root/eniya@123, auto-create DB).
# Railway: set DB_URL, or nothing at all - the MYSQL* variables injected by
# the Railway MySQL plugin are picked up automatically.
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:eniya_mart}?sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:eniya@123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# ------------------------------- JPA -------------------------
# "update" creates/updates the schema automatically.
# You may also run backend/database.sql manually first.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------- JWT -------------------------
# Override in production with the environment variable JWT_SECRET
app.jwt.secret=${JWT_SECRET:ENIYA_MART_JWT_SECRET_KEY_2026_CHANGE_THIS_IN_PRODUCTION_0123456789abcdef}
app.jwt.expiration-ms=86400000
app.jwt.token-prefix=Bearer

# ------------------------------- App -------------------------
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${CORS_ORIGINS:*}

# Forgot-password e-mail.
# false (default): the reset link is written to the console and returned as "devResetUrl"
#                  so the flow works end-to-end without an SMTP server.
# true : an e-mail is sent through the SMTP settings below.
app.mail.enabled=false
app.mail.from=no-reply@eniyamart.com

# ------------------------------- SMTP (optional) -------------
# Uncomment and fill in to send real reset mails (app.mail.enabled=true)
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=your-account@gmail.com
#spring.mail.password=your-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# ------------------------------- Logging ---------------------
logging.level.com.eniyamart=INFO
