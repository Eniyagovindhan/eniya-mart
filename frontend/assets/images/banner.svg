<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" role="img" aria-label="ENIYA MART banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131921"/>
      <stop offset="0.55" stop-color="#232f3e"/>
      <stop offset="1" stop-color="#37475a"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#febd69"/>
      <stop offset="1" stop-color="#ffb700"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe4ee"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="420" fill="url(#bg)"/>
  <circle cx="1180" cy="90" r="190" fill="#febd69" opacity="0.10"/>
  <circle cx="960" cy="360" r="150" fill="#febd69" opacity="0.08"/>
  <circle cx="1380" cy="330" r="120" fill="#ffffff" opacity="0.05"/>

  <!-- shopping bag -->
  <g transform="translate(980,90)">
    <path d="M20 90 L260 90 L236 320 L44 320 Z" fill="url(#bag)"/>
    <path d="M78 90 C78 24 202 24 202 90" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path d="M84 170 L196 170 M78 226 L202 226" stroke="#131921" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- parcel box -->
  <g transform="translate(1210,190)">
    <rect x="0" y="0" width="180" height="150" rx="10" fill="url(#box)"/>
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#cbd5e1"/>
    <rect x="76" y="0" width="28" height="150" fill="#febd69"/>
    <path d="M0 76 L180 76" stroke="#94a3b8" stroke-width="6"/>
  </g>

  <!-- price tag -->
  <g transform="translate(880,240) rotate(-12)">
    <path d="M0 26 L26 0 L120 0 L120 94 L26 94 Z" fill="#ffffff" opacity="0.92"/>
    <circle cx="34" cy="47" r="12" fill="#131921"/>
    <path d="M56 66 L100 66" stroke="#febd69" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- small stars -->
  <g fill="#febd69" opacity="0.9">
    <path d="M905 60 l10 22 24 3 -17 17 4 24 -21 -11 -21 11 4 -24 -17 -17 24 -3 z"/>
    <path d="M1400 70 l8 18 20 2 -14 14 3 20 -17 -9 -17 9 3 -20 -14 -14 20 -2 z"/>
    <path d="M840 350 l7 15 17 2 -12 12 3 17 -15 -8 -15 8 3 -17 -12 -12 17 -2 z"/>
  </g>
</svg>
